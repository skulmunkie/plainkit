name: Release

# Push a tag vX.Y.Z (it must equal core/VERSION; see the release pull request procedure in CONTRIBUTING.md) to create a GitHub release carrying the runtime SDK (core/dist without
# modules/) as plainkit-dist-<version>.zip, the dev-tool modules (core/dist/modules) as plainkit-modules-<version>.zip, the two integrity manifests, the .nupkg (both units) and the
# agent skills as plainkit-skills-<version>.zip, and then to publish the NuGet package (PlainKit.Blazor). The npm package (plainkit) is optional: it is published only when a repository secret NPM_TOKEN exists.
# Repository secrets: NUGET_USER (your nuget.org username, not your email); NPM_TOKEN (optional, an npm automation token).
# The tag does not carry core/dist (generated files are not in git): pinned versions are the release assets and the NuGet package, built here.
# NuGet uses Trusted Publishing (OIDC): no API key is stored. A policy on nuget.org trusts this repository and this workflow file
# (release.yml); the NuGet/login step below swaps GitHub's short-lived token for a one-hour NuGet key just before the push.
#
# Least privilege (issue #116): only the steps that actually publish need write access to anything, so the workflow is two jobs. `build` (contents: read) does
# everything that runs the repository's own scripts and third-party build tooling on the tagged commit — bootstrap, tests, the dotnet pack, the zips — and
# uploads the results as a workflow artifact. `publish` (contents: write, id-token: write) only downloads that artifact and talks to GitHub releases, NuGet
# and npm: nothing that runs arbitrary repository code holds a token that can write anything. `publish` also runs behind the `release` environment, so once
# the owner creates that environment with themselves as a required reviewer (.github/REPO-SETTINGS.md, section 6), a pushed tag needs an approval click
# before anything is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The version comes from core/VERSION (the one version of the SDK and the Blazor package), not from the tag. The tag must equal it, and the
      # release pull request must have refreshed the API baseline for it: both are checked below, after the bootstrap.
      - name: Take the version
        id: version
        run: |
          VERSION=$(tr -d '\r\n' < core/VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Generated files (core/dist and the rest) are not in git. Everything below packs, zips and produces what the publish job later pushes: npm's
      # `files` in core/package.json (the runtime only), the NuGet static web assets (both units) and the zips.
      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      # After the bootstrap, so the stamps in the generated files (js/version.js, dist/manifest.json, the package copy) are checked as well.
      - name: Check the tag and the stamps
        run: node core/tools/versioning.mjs check --release --tag "$GITHUB_REF_NAME"

      - name: Tests
        run: |
          node --test "core/tests/*.test.mjs" "core/elements/*/*.test.mjs" "core/modules/*/*.test.mjs" "scripts/tests/*.test.mjs"

      - name: Bootstrap leaves the tree clean
        run: node scripts/generated.mjs check

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test and pack PlainKit.Blazor
        run: |
          dotnet test PlainKit.slnx --configuration Release
          dotnet pack blazor/src/PlainKit.Blazor --configuration Release -p:Version="$VERSION" -o nupkg

      # Two units, two zips. The runtime zip holds everything in core/dist except modules/ (its manifest.json lists the same set). The modules zip holds modules/ (its own
      # manifest.json inside), with the folder name at the top: unzip it into the runtime folder and it lands at dist/modules/, next to the runtime it imports.
      - name: Zip dist (the runtime) for the release
        run: cd core/dist && zip -r ../../plainkit-dist-$VERSION.zip . -x 'modules/*'

      - name: Zip the modules for the release
        run: cd core/dist && zip -r ../../plainkit-modules-$VERSION.zip modules

      # The agent skills as their own asset: the skill folders (plainkit-sdk/, plainkit-blazor/) at the top of the zip, ready to unzip into .claude/skills/.
      - name: Zip the agent skills for the release
        run: cd core/dist/skills && zip -r ../../../plainkit-skills-$VERSION.zip .

      - name: Collect the release assets
        run: |
          mkdir -p release-assets
          cp "plainkit-dist-$VERSION.zip" "plainkit-modules-$VERSION.zip" "plainkit-skills-$VERSION.zip" release-assets/
          cp "nupkg/PlainKit.Blazor.$VERSION.nupkg" release-assets/
          cp core/dist/manifest.json release-assets/dist-manifest.json
          cp core/dist/modules/manifest.json "release-assets/plainkit-modules-manifest-$VERSION.json"

      # No token here: this job never holds contents: write or id-token: write. The publish job downloads this artifact and does everything that touches
      # GitHub releases, NuGet and npm.
      - name: Upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # A secret cannot be tested in an if: expression, so it is copied to an env var the step can test.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Bootstrap (generate core/dist for npm publish)
        run: node scripts/bootstrap.mjs --quiet

      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      # The GitHub CLI that the runner already has, not a third-party action: this job holds contents: write and an OIDC token, so nothing outside GitHub's own
      # actions and NuGet's login runs in it. A re-run of the job updates the release that exists (upload --clobber) instead of creating another.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("release-assets/plainkit-dist-$VERSION.zip" "release-assets/plainkit-modules-$VERSION.zip" "release-assets/plainkit-skills-$VERSION.zip" "release-assets/PlainKit.Blazor.$VERSION.nupkg" release-assets/dist-manifest.json "release-assets/plainkit-modules-manifest-$VERSION.json")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            # 1.2.3-alpha.1, -beta.N and -rc.N are marked as pre-releases on GitHub (NuGet treats them as pre-releases by their label).
            flags=(--generate-notes --verify-tag)
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" "${flags[@]}"
          fi

      # The registries come after the GitHub release, so a problem with one of them never keeps the dist zip, the modules zip, the skills zip, the .nupkg and the
      # manifest from being attached. A failed step still turns the run red,
      # and a re-run of the failed job picks up where it stopped (the release step updates the existing release; the NuGet push skips a duplicate).

      # Requested right before the push: the key it returns lasts one hour.
      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The key goes in through the environment, never spliced into the script text.
      - name: Push PlainKit.Blazor to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "release-assets/PlainKit.Blazor.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to npm (only when NPM_TOKEN is set)
        if: always() && env.NPM_TOKEN != ''
        working-directory: core
        run: |
          # A pre-release (1.2.3-beta.1) must not become the "latest" dist-tag: it goes to "next".
          if [[ "$VERSION" == *-* ]]; then npm publish --provenance --access public --tag next; else npm publish --provenance --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
