name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Blazor port (blazor/, Plainkit.Blazor) moves here after the toolkit; its job is added when it lands.
jobs:
  core:
    name: Toolkit (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node tests
        run: node --test "core/tests/*.test.mjs" "core/components/*/*.test.mjs" "core/elements/*/*.test.mjs" "core/modules/*/*.test.mjs"

      # The build is deterministic and dist is committed, so a rebuild must change nothing.
      - name: Rebuild and check dist is current
        run: |
          node core/tools/build.mjs
          git diff --exit-code -- core/dist
