name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: the `no-changelog` label is read by the Changelog job, so adding it must re-run the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# core: the vanilla toolkit. blazor: PlainKit.Blazor, which serves a copy of core/dist (scripts/publish-dist.mjs).
# Generated files are not in git: each job that needs them runs node scripts/bootstrap.mjs first (a few seconds). Before this change the jobs took
# about 15 s (node) and 31 s (dotnet); the bootstrap adds its own few seconds to each.
jobs:
  core:
    name: Toolkit (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Generated files (core/dist, the element modules, the Blazor wrappers, the skills, the package copy) are not in git: produce them first.
      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      - name: Node tests
        run: node --test "core/tests/*.test.mjs" "core/elements/*/*.test.mjs" "core/modules/*/*.test.mjs" "scripts/tests/*.test.mjs"

      # One version for the SDK and PlainKit.Blazor (core/VERSION): every place it is stamped must agree.
      - name: Version is consistent
        run: node core/tools/versioning.mjs check

      # A pull request that changes core/VERSION is a release pull request: its API baseline must be refreshed for that version, and the version
      # must cover what the API changed since the previous release (a breaking change needs a major bump, or a minor one while the major is 0).
      # Any other pull request just prints what its API changes would need.
      - name: Release pull request checks
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:core/site/scorecard/api.baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          # (A version file that the base branch did not have yet is being introduced, not released.)
          if git cat-file -e "origin/${{ github.base_ref }}:core/VERSION" 2>/dev/null && ! git diff --quiet "origin/${{ github.base_ref }}" -- core/VERSION; then
            echo "core/VERSION changed: this is a release pull request"
            node core/tools/versioning.mjs check --release
            node core/tools/versioning.mjs bump --baseline "$RUNNER_TEMP/base-baseline.json" --require
          else
            echo "core/VERSION unchanged: not a release pull request (information only)"
            node core/tools/versioning.mjs bump --baseline "$RUNNER_TEMP/base-baseline.json"
          fi

      # Generated output is not source controlled: after the bootstrap no tracked file may have changed and no generated path may be tracked.
      # (That every generator is deterministic and that what is on disk is what it produces are node tests: core/tests/generated-current.test.mjs,
      # scripts/tests/skills.test.mjs, scripts/tests/generate-blazor.test.mjs.)
      - name: Bootstrap leaves the tree clean
        run: node scripts/generated.mjs check

  # Changelog fragments (changelog/README.md): every pull request that changes more than docs adds one file to changelog/unreleased/, and the
  # release pull request compiles them into CHANGELOG.md (so none may be left).
  changelog:
    name: Changelog (fragments)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fragments are valid
        run: node scripts/changelog.mjs check

      # The label `no-changelog` (with the reason in the description) skips the "needs a fragment" rule.
      - name: Pull request adds a fragment
        env:
          PK_NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '' }}
        run: node scripts/changelog.mjs check-pr --base "origin/${{ github.base_ref }}"

      # A release pull request (core/VERSION changed, as in "Release pull request checks") compiles the fragments into CHANGELOG.md.
      - name: Release pull request has compiled the changelog
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:core/VERSION" 2>/dev/null && ! git diff --quiet "origin/${{ github.base_ref }}" -- core/VERSION; then
            left=$(find changelog/unreleased -type f ! -name .gitkeep)
            if [ -n "$left" ]; then
              echo "core/VERSION changed (a release pull request) but fragments are left; run: node scripts/changelog.mjs compile --version <X.Y.Z>"
              echo "$left"
              exit 1
            fi
            echo "release pull request: no fragments left"
          else
            echo "not a release pull request"
          fi

  blazor:
    name: Blazor (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Pk* wrappers and the package's copy of core/dist are generated, not in git; the project refuses to build without them.
      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      - name: Build and test
        run: dotnet test PlainKit.slnx --configuration Release

  # The in-browser element suite (core/tests/browser), on demand only (Actions > CI > Run workflow): not a required check, see core/README.md.
  # It uses the Chrome that ubuntu-latest already has and no npm package; the run refreshes core/tests/browser/report.json on the runner only.
  browser:
    name: Element suite in a real browser (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      - name: Run the suite and check the attestation test against it
        env:
          PK_CHROME: /usr/bin/google-chrome
        run: node scripts/attest-browser.mjs

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: core/tests/browser/report.json
          if-no-files-found: ignore
