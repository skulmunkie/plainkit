name: UI review sweep

# The full UI review (every element and scenario, node scripts/ui-review.mjs --all) on main, nightly and on demand, in four shards. A pull request only reviews
# the elements it changes (ci.yml, job ui-review); this is the coverage check for everything else, including token, base CSS and layout changes (issue #777).
# An error finding fails the shard, so the scheduled run shows red on main. The screenshots are kept as the artifacts ui-review-sweep-1 to -4.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-review-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PK_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install build dependencies (esbuild)
        run: npm ci

      - name: Render and audit everything
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ui-review.mjs --all --shard "$SHARD/4"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-review-sweep-${{ matrix.shard }}
          path: review-output/
          if-no-files-found: ignore
