name: CodeQL

# Code scanning with GitHub's own CodeQL for the SDK (JavaScript) and the Blazor package (C#). It runs weekly and on demand, NOT on pull requests: it is an
# audit tool, not a gate, and no branch protection rule may require it (a required check that a workflow with a schedule trigger never reports would stay
# pending). Results appear under Security > Code scanning once code scanning is available for the repository (public repositories have it).
# Generated files are not in git: the bootstrap produces them so the scan sees the code that ships (the element modules, the generated components).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
