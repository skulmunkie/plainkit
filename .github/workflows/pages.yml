name: Pages

# Publishes the SDK's own site (gallery, files, scorecard, theme editor, dev tools) and dist/ to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Only what it takes to build the artifact: contents to check out the source, pages to let configure-pages read (and, the first time, create) the
  # Pages site config. No id-token: build never talks to the OIDC-verified deploy-pages endpoint (issue #116: only deploy needs that).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Generated files (dist, the element modules, the gallery data) are not in git: produce them, then copy what the site needs.
      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      - name: Build the site
        run: node scripts/build-pages.mjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
