name: Pages

# Publishes the SDK's own site (gallery, files, scorecard, theme editor, dev tools) and dist/ to GitHub Pages on the same trigger as a
# release (release.yml: push a tag vX.Y.Z), so the live site's dist/ never drifts ahead of or behind the published NuGet/npm version.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Only what it takes to build the artifact: contents to check out the source, pages to let configure-pages read (and, the first time, create) the
  # Pages site config. No id-token: build never talks to the OIDC-verified deploy-pages endpoint (issue #116: only deploy needs that).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install build dependencies (esbuild)
        run: npm ci

      # Generated files (dist, the element modules, the gallery data) are not in git: produce them, then copy what the site needs.
      - name: Bootstrap (generate everything)
        run: node scripts/bootstrap.mjs --quiet

      - name: Build the site
        run: node scripts/build-pages.mjs _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
