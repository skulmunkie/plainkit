<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK template: Dashboard">
<title>Dashboard - SDK template</title>
<link rel="stylesheet" href="../../../plainkit.css">
<link rel="stylesheet" href="../../../plainkit-compat.css">
</head>
<body>
<main id="content">
<div class="grid"><div class="stat-card"><span class="stat-card-label">Metric one</span><div class="stat-card-value-row"><span class="stat-card-value">128</span></div></div><div class="stat-card stat-card--positive"><span class="stat-card-label">Metric two</span><div class="stat-card-value-row"><span class="stat-card-value">$4,210</span></div><span class="stat-card-subtext">+12% vs last period</span></div><div class="stat-card stat-card--warning"><span class="stat-card-label">Metric three</span><div class="stat-card-value-row"><span class="stat-card-value">7</span></div></div><div class="stat-card stat-card--critical"><span class="stat-card-label">Metric four</span><div class="stat-card-value-row"><span class="stat-card-value">3</span></div></div></div>
<div class="split"><section class="card"><div class="card-header"><h2>Trend</h2></div><div class="stack-sm" aria-label="Progress by phase"><div class="cluster cluster--horizontal cluster--gap-sm cluster--align-center cluster--justify-start"><span class="muted">P1</span><div class="progress u-flex-1" role="progressbar" aria-label="P1" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><span></span></div></div><div class="cluster cluster--horizontal cluster--gap-sm cluster--align-center cluster--justify-start"><span class="muted">P2</span><div class="progress u-flex-1" role="progressbar" aria-label="P2" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><span></span></div></div><div class="cluster cluster--horizontal cluster--gap-sm cluster--align-center cluster--justify-start"><span class="muted">P3</span><div class="progress u-flex-1" role="progressbar" aria-label="P3" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"><span></span></div></div><div class="cluster cluster--horizontal cluster--gap-sm cluster--align-center cluster--justify-start"><span class="muted">P4</span><div class="progress u-flex-1" role="progressbar" aria-label="P4" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100"><span></span></div></div><div class="cluster cluster--horizontal cluster--gap-sm cluster--align-center cluster--justify-start"><span class="muted">P5</span><div class="progress u-flex-1" role="progressbar" aria-label="P5" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><span></span></div></div></div></section>
<section class="card"><div class="card-header"><h2>Recent</h2></div><div class="u-scroll-x"><table class="data "><thead><tr><th>Name</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody><tr class="dg-clickable"><td><a href="#">Item one</a></td><td><span class="chip chip-success">Active</span></td><td class="num">$12.00</td></tr><tr class="dg-clickable"><td><a href="#">Item two</a></td><td><span class="chip chip-muted">Draft</span></td><td class="num">$8.50</td></tr><tr class="dg-clickable"><td><a href="#">Item three</a></td><td><span class="chip chip-warn">Review</span></td><td class="num">$20.00</td></tr><tr class="dg-clickable"><td><a href="#">Item four</a></td><td><span class="chip chip-success">Active</span></td><td class="num">$5.25</td></tr></tbody></table></div></section></div>
</main>
<script type="module" src="dashboard.js"></script>

</body>
</html>
