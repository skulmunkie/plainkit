<!-- tabs: canonical markup. Each sample is a valid, copy-pasteable fragment; the build reads the @sample markers. -->

<!-- @sample control="tabs" title="Toggle tabs (arrow keys, Home, End)" -->
<div class="tabs" role="tablist" data-pk-tabs="toggle"><button type="button" class="tab active" role="tab" aria-selected="true" tabindex="0">Overview</button><button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1">Orders <span class="muted">(4)</span></button><button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1">Notes</button></div>

<!-- @sample control="tabs" title="Closable, scrolling strip (close removes the tab)" -->
<div class="tabs tabs--scroll" role="tablist" data-pk-tabs="toggle" data-pk-close="remove"><button type="button" class="tab active" role="tab" aria-selected="true" tabindex="0">app.css</button><button type="button" class="tab-close" aria-label="Close app.css">&#10005;</button><button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1">tokens.css</button><button type="button" class="tab-close" aria-label="Close tokens.css">&#10005;</button><button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1">overlay.js</button><button type="button" class="tab-close" aria-label="Close overlay.js">&#10005;</button><button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1">gallery.data.js</button><button type="button" class="tab-close" aria-label="Close gallery.data.js">&#10005;</button></div>
