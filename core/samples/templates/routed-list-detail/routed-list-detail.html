<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK template: Routed list and detail">
<title>Routed list and detail - SDK template</title>
<link rel="stylesheet" href="../../../plainkit.css">
<link rel="stylesheet" href="routed-list-detail.css">
</head>
<body>
<pk-workspace id="content" fill main-label="Things" aside-label="Thing">
  <pk-stack id="list" fill gap="sm">
    <pk-tabs id="status-tabs" value="all">
      <pk-tab value="all">All</pk-tab>
      <pk-tab value="Active">Active</pk-tab>
      <pk-tab value="Draft">Draft</pk-tab>
      <pk-tab value="Archived">Archived</pk-tab>
    </pk-tabs>
    <pk-field label="Search"><pk-input id="search" type="search" placeholder="Search things"></pk-input></pk-field>
    <pk-table id="things" label="Things" clickable hover row-key="id" sticky-header manual columns='[{"key":"name","label":"Name","sortable":true},{"key":"status","label":"Status","sortable":true},{"key":"updated","label":"Updated","sortable":true,"hidePhone":true}]'>
      <pk-pagination slot="footer" id="pager" label="Things"></pk-pagination>
    </pk-table>
  </pk-stack>
  <pk-stack slot="aside" id="detail" gap="sm">
    <pk-page-header id="detail-head" variant="section" heading="Thing">
      <pk-button slot="actions" id="detail-back" size="mini" variant="ghost">&larr; Things</pk-button>
      <pk-button slot="actions" id="detail-close" size="mini" variant="ghost" icon label="Close the record" icon-name="x"></pk-button>
    </pk-page-header>
    <pk-form summary>
      <form id="detail-form">
        <pk-stack gap="sm">
          <pk-field label="Name" required><pk-input name="name" required></pk-input></pk-field>
          <pk-field label="Status"><pk-select name="status"><option>Active</option><option>Draft</option><option>Archived</option></pk-select></pk-field>
          <pk-form-actions><pk-button type="button" id="detail-cancel" variant="plain">Cancel</pk-button><pk-button type="submit">Save</pk-button></pk-form-actions>
        </pk-stack>
      </form>
    </pk-form>
  </pk-stack>
</pk-workspace>
<script type="module" src="routed-list-detail.js"></script>

</body>
</html>
