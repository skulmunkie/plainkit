<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK template: Auth">
<title>Sign in - SDK template</title>
<link rel="stylesheet" href="../../../plainkit.css">
</head>
<body>
<div class="shell shell--center">
  <main class="card stack">
    <h1>Sign in</h1>
    <label class="ff"><span>Email</span><input type="text" autocomplete="username"></label>
    <label class="ff"><span>Password</span><input type="password" autocomplete="current-password"></label>
    <label class="chk"><input type="checkbox"><span>Keep me signed in</span></label>
    <button class="btn-primary" type="button">Sign in</button>
    <p class="muted"><a href="../page/page.html">Back to the templates</a></p>
  </main>
</div>
<script type="module" src="auth.js"></script>

</body>
</html>
