<form><pk-stack>
<pk-alert kind="success" data-saved hidden>Settings saved.</pk-alert>
<pk-card heading="Store"><pk-field-row><pk-field label="Name" help="Shown on packing slips."><pk-input value="Example store"></pk-input></pk-field><pk-field label="Currency"><pk-select value="USD"><option>USD</option><option>EUR</option><option>GBP</option></pk-select></pk-field></pk-field-row></pk-card>
<pk-card heading="Sync"><pk-switch checked>Sync automatically</pk-switch></pk-card>
<pk-accordion-item heading="Advanced"><pk-field label="Rate limit"><pk-range min="10" max="120" value="60" output></pk-range></pk-field></pk-accordion-item>
<pk-form-actions sticky data-bar><span slot="status"><pk-alert kind="warning" plain inline compact>Unsaved changes</pk-alert></span><pk-button type="button" data-save>Save</pk-button><pk-button type="button" variant="ghost" data-discard>Discard</pk-button></pk-form-actions>
</pk-stack></form>
