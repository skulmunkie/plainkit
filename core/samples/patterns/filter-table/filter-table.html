<pk-table label="Items" caption="Items" striped hover selectable cards filterable sort="name" selected='[1,4]' filters='{"status":"Active"}' data-table columns='[{"key":"name","label":"Name","sortable":true},{"key":"status","label":"Status"},{"key":"amount","label":"Amount","type":"number","sortable":true}]' rows='[{"id":1,"name":"Item one","status":"Active","amount":"$12.00"},{"id":2,"name":"Item two","status":"Draft","amount":"$8.50"},{"id":3,"name":"Item three","status":"Review","amount":"$20.00"},{"id":4,"name":"Item four","status":"Active","amount":"$5.25"}]'>
