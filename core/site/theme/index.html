<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDK Theme editor</title>
<link rel="stylesheet" href="../../plainkit.css">
<link rel="stylesheet" href="../site.css">
</head>
<body class="site">
<div class="site-boot-bar" aria-hidden="true"></div>
<pk-stack fill gap="none">
    <pk-container id="boot-notice" padding="md">
        <pk-alert kind="warning" role="status">
            Loading the theme editor. If this message stays, serve the <code>core</code> folder with a static server (browsers block modules on <code>file://</code>).
        </pk-alert>
    </pk-container>
    <pk-loading-overlay busy label="Loading theme editor…" id="te-loading">
        <pk-container id="te-host" size="full" padding="md"></pk-container>
    </pk-loading-overlay>
</pk-stack>
<script type="module" src="theme.js"></script>
</body>
</html>
