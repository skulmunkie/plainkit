<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainkit Settings</title>
<link rel="stylesheet" href="../../plainkit.css">
<link rel="stylesheet" href="../site.css">
</head>
<body>
<div class="site-body"><div class="site-scroll"><pk-stack class="container" id="settings-root">
    <pk-page-header heading="Settings" level="1"><span slot="meta" class="muted">Preferences for this browser. They are kept in local storage and apply to every page of the site and to the gallery.</span></pk-page-header>
    <pk-card heading="Theme">
        <pk-button-group label="Theme" mode="single"><pk-button toggle variant="ghost" value="dark">Dark</pk-button><pk-button toggle variant="ghost" value="light">Light</pk-button></pk-button-group>
    </pk-card>
    <pk-card heading="Gallery">
        <pk-stack gap="sm">
            <pk-field label="Text size in samples"><pk-select id="set-scale"><option value="0.9">90%</option><option value="1">100%</option><option value="1.15">115%</option><option value="1.3">130%</option></pk-select></pk-field>
            <pk-field label="Sample width"><pk-select id="set-width"><option value="desktop">Desktop</option><option value="phone">Phone (375px)</option></pk-select></pk-field>
        </pk-stack>
    </pk-card>
</pk-stack></div></div>
<script type="module" src="page.js"></script>
</body>
</html>
