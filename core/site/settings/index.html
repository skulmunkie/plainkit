<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainkit Settings</title>
<link rel="stylesheet" href="../../plainkit.css">
<link rel="stylesheet" href="../site.css">
</head>
<body>
<div class="site-body"><div class="site-scroll"><div class="container stack" id="settings-root">
    <header><h2>Settings</h2><p class="muted">Preferences for this browser. They are kept in local storage and apply to every page of the site and to the gallery.</p></header>
    <section class="card"><div class="card-header"><h2>Theme</h2></div>
        <div class="btn-group" role="group" aria-label="Theme"><button type="button" class="btn-ghost" data-theme-set="dark" aria-pressed="false">Dark</button><button type="button" class="btn-ghost" data-theme-set="light" aria-pressed="false">Light</button></div></section>
    <section class="card"><div class="card-header"><h2>Gallery</h2></div>
        <div class="stack-sm">
            <label class="ff"><span>Text size in samples</span><select id="set-scale"><option value="0.9">90%</option><option value="1">100%</option><option value="1.15">115%</option><option value="1.3">130%</option></select></label>
            <label class="ff"><span>Sample width</span><select id="set-width"><option value="desktop">Desktop</option><option value="phone">Phone (375px)</option></select></label>
        </div></section>
</div></div></div>
<script type="module" src="page.js"></script>
</body>
</html>
