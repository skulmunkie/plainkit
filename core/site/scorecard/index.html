<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDK Scorecard</title>
<link rel="stylesheet" href="../../plainkit.css">
<link rel="stylesheet" href="../site.css">
</head>
<body class="site">
<div class="site-boot-bar" aria-hidden="true"></div>
<pk-stack fill gap="none"><pk-container fill scroll="y" label="Scorecard" size="full" padding="md"><pk-container size="lg" padding="none" id="sc-root">
    <pk-alert kind="warning" id="boot-notice" role="status">
        Loading the scorecard. If this message stays, serve the <code>core</code> folder with a static server (browsers block modules on <code>file://</code>).
    </pk-alert>
</pk-container></pk-container></pk-stack>
<script type="module" src="scorecard.js"></script>
</body>
</html>
