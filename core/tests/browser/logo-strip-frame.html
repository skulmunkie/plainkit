<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo strip (browser case fixture)</title>
<link rel="stylesheet" href="../../plainkit.css">
</head>
<body>
<main class="u-p-1r-1p25r">
<pk-grid id="strip" min="9rem" tracks="repeat(5, minmax(0, 10rem))" gap="md">
<a href="#acme" aria-label="Acme"><pk-media ratio="3/1"><svg viewBox="0 0 3 1" role="img" aria-label="Acme logo"><rect width="3" height="1" fill="currentColor" opacity="0.15"></rect></svg></pk-media></a>
<a href="#globex" aria-label="Globex"><pk-media ratio="3/1"><svg viewBox="0 0 3 1" role="img" aria-label="Globex logo"><rect width="3" height="1" fill="currentColor" opacity="0.15"></rect></svg></pk-media></a>
<a href="#initech" aria-label="Initech"><pk-media ratio="3/1"><svg viewBox="0 0 3 1" role="img" aria-label="Initech logo"><rect width="3" height="1" fill="currentColor" opacity="0.15"></rect></svg></pk-media></a>
<a href="#umbrella" aria-label="Umbrella"><pk-media ratio="3/1"><svg viewBox="0 0 3 1" role="img" aria-label="Umbrella logo"><rect width="3" height="1" fill="currentColor" opacity="0.15"></rect></svg></pk-media></a>
<a href="#hooli" aria-label="Hooli"><pk-media ratio="3/1"><svg viewBox="0 0 3 1" role="img" aria-label="Hooli logo"><rect width="3" height="1" fill="currentColor" opacity="0.15"></rect></svg></pk-media></a>
</pk-grid>
</main>
<script type="module" src="quote-frame.js"></script>
</body>
</html>
