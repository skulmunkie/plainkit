<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK template: List and detail (CRUD)">
<title>List and detail (CRUD) - SDK template</title>
<link rel="stylesheet" href="../../../plainkit.css">
</head>
<body>
<main id="content">
<pk-stack>
<pk-card><form><pk-grid min="16rem"><pk-field label="Search"><pk-input type="search" placeholder="Name"></pk-input></pk-field><pk-field label="Status"><pk-select><option>Any</option><option>Active</option><option>Draft</option></pk-select></pk-field></pk-grid></form></pk-card>
<pk-grid columns="2" min="20rem"><pk-card heading="Items"><pk-table label="Items" striped hover clickable cards columns='[{"key":"name","label":"Name"},{"key":"status","label":"Status"},{"key":"amount","label":"Amount","type":"number"}]' rows='[{"id":1,"name":"Item one","status":"Active","amount":"$12.00"},{"id":2,"name":"Item two","status":"Draft","amount":"$8.50"},{"id":3,"name":"Item three","status":"Review","amount":"$20.00"},{"id":4,"name":"Item four","status":"Active","amount":"$5.25"}]'><a slot="cell-1-name" href="#">Item one</a><pk-badge slot="cell-1-status" variant="ok">Active</pk-badge><a slot="cell-2-name" href="#">Item two</a><pk-badge slot="cell-2-status" variant="muted">Draft</pk-badge><a slot="cell-3-name" href="#">Item three</a><pk-badge slot="cell-3-status" variant="warn">Review</pk-badge><a slot="cell-4-name" href="#">Item four</a><pk-badge slot="cell-4-status" variant="ok">Active</pk-badge><pk-pagination slot="footer" page="2" pages="3" label="Pages"></pk-pagination></pk-table></pk-card>
<pk-card heading="Item one"><pk-cluster slot="actions" gap="sm"><pk-button size="mini" variant="ghost" data-open="#edit-modal">Edit</pk-button><pk-button size="mini" variant="warn" data-open="#delete-modal">Delete</pk-button></pk-cluster><pk-field-list><dt>Name</dt><dd>Item one</dd><dt>Status</dt><dd>Active</dd><dt>Created</dt><dd>Sep 12</dd><dt>Amount</dt><dd>$12.00</dd></pk-field-list></pk-card></pk-grid>
</pk-stack>
<pk-dialog id="create-modal" heading="New item" size="sm"><pk-stack><pk-field label="Name"><pk-input></pk-input></pk-field><pk-field label="Status"><pk-select><option>Draft</option><option>Active</option></pk-select></pk-field></pk-stack><pk-button slot="footer" variant="ghost" data-close>Cancel</pk-button><pk-button slot="footer" data-close>Create</pk-button></pk-dialog>
<pk-dialog id="edit-modal" heading="Edit item" size="sm"><pk-field label="Name"><pk-input value="Item one"></pk-input></pk-field><pk-button slot="footer" variant="ghost" data-close>Cancel</pk-button><pk-button slot="footer" data-close>Save</pk-button></pk-dialog>
<pk-dialog id="delete-modal" heading="Delete this item?" size="sm"><p>This cannot be undone.</p><pk-button slot="footer" variant="ghost" data-close>Cancel</pk-button><pk-button slot="footer" variant="warn" data-close>Delete</pk-button></pk-dialog>
</main>
<script type="module" src="crud.js"></script>

</body>
</html>
