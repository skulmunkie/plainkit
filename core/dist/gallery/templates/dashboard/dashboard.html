<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK template: Dashboard">
<title>Dashboard - SDK template</title>
<link rel="stylesheet" href="../../../plainkit.css">
<link rel="stylesheet" href="../../../plainkit-compat.css">
</head>
<body>
<main id="content">
<pk-stack>
<pk-grid min="12rem"><pk-stat tile label="Metric one" value="128"></pk-stat><pk-stat tile tone="positive" label="Metric two" value="$4,210" subtext="+12% vs last period"></pk-stat><pk-stat tile tone="warning" label="Metric three" value="7"></pk-stat><pk-stat tile tone="critical" label="Metric four" value="3"></pk-stat></pk-grid>
<div class="split"><pk-card heading="Trend"><pk-stack gap="sm"><pk-progress label="P1" value="80" show-value></pk-progress><pk-progress label="P2" value="60" show-value></pk-progress><pk-progress label="P3" value="90" show-value></pk-progress><pk-progress label="P4" value="45" show-value></pk-progress><pk-progress label="P5" value="70" show-value></pk-progress></pk-stack></pk-card>
<pk-card heading="Recent"><pk-table label="Recent" clickable cards columns='[{"key":"name","label":"Name"},{"key":"status","label":"Status"},{"key":"amount","label":"Amount","type":"number"}]' rows='[{"id":1,"name":"Item one","status":"Active","amount":"$12.00"},{"id":2,"name":"Item two","status":"Draft","amount":"$8.50"},{"id":3,"name":"Item three","status":"Review","amount":"$20.00"},{"id":4,"name":"Item four","status":"Active","amount":"$5.25"}]'><a slot="cell-1-name" href="#">Item one</a><pk-badge slot="cell-1-status" variant="ok">Active</pk-badge><a slot="cell-2-name" href="#">Item two</a><pk-badge slot="cell-2-status" variant="muted">Draft</pk-badge><a slot="cell-3-name" href="#">Item three</a><pk-badge slot="cell-3-status" variant="warn">Review</pk-badge><a slot="cell-4-name" href="#">Item four</a><pk-badge slot="cell-4-status" variant="ok">Active</pk-badge></pk-table></pk-card></div>
</pk-stack>
</main>
<script type="module" src="dashboard.js"></script>

</body>
</html>
