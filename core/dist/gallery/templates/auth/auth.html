<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK template: Auth">
<title>Sign in - SDK template</title>
<link rel="stylesheet" href="../../../plainkit.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="u-w-full u-mw-24r u-p-1r-1p25r">
    <pk-card heading="Sign in" level="1">
      <pk-stack>
        <pk-field label="Email"><pk-input autocomplete="username"></pk-input></pk-field>
        <pk-field label="Password"><pk-input type="password" reveal autocomplete="current-password"></pk-input></pk-field>
        <pk-checkbox>Keep me signed in</pk-checkbox>
        <pk-button block>Sign in</pk-button>
        <p class="muted"><a href="../page/page.html">Back to the templates</a></p>
      </pk-stack>
    </pk-card>
  </main>
<script type="module" src="auth.js"></script>

</body>
</html>
