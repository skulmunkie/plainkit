<pk-stack part="shell" gap="md"><pk-cluster part="toolbar" justify="end" data-if-not="actionsInHeader"><pk-button part="cancel" variant="ghost" data-if="cancellable">Cancel</pk-button><slot name="actions"></slot><pk-button part="delete" variant="warn" disabled="{{busy}}" data-if="deletable">{{deleteLabel}}</pk-button><pk-button part="save" variant="primary" busy="{{busy}}" busy-text="{{busyText}}" disabled="{{saveDisabled}}">{{saveLabel}}</pk-button></pk-cluster><slot name="tabs"></slot><pk-alert part="error" kind="danger" data-if="error">{{error}}</pk-alert><pk-detail-layout part="layout"><pk-form part="form" summary><slot></slot></pk-form><slot name="sidebar" slot="sidebar"></slot></pk-detail-layout></pk-stack>
