<!-- form-field: canonical markup. Each sample is a valid, copy-pasteable fragment; the build reads the @sample markers. -->

<!-- @sample control="form-field" title="Row of fields" -->
<div class="form-row"><label class="ff"><span>Name <span class="ff-required" aria-hidden="true">*</span></span><input type="text" value="Widget 1"></label><label class="ff"><span>Status <span class="ff-hint">- optional</span></span><select><option>Active</option><option>Draft</option></select></label></div><p class="form-error">This is a form error.</p>

<!-- @sample control="form-row" title="With caption" -->
<div class="form-row"><label class="ff ff--wide"><span>Cost</span><input type="text" value="9.50"></label><p class="muted">Per-unit purchase cost.</p></div>

<!-- @sample control="select-field" title="Select" -->
<label class="ff"><span>Status</span><select><option value="">- none -</option><option>Active</option><option>Draft</option><optgroup label="Other"><option>Archived</option></optgroup></select></label>

<!-- @sample control="check-field" title="Checkboxes" -->
<label class="chk"><input type="checkbox" checked><span>Track inventory</span></label><label class="chk"><input type="checkbox"><span>Include archived</span></label><label class="chk"><input type="checkbox" disabled><span>Disabled</span></label>

<!-- @sample control="masked-input" title="Password input with reveal" -->
<pk-input type="password" reveal label="Token" value="s3cret-token"></pk-input>

<!-- @sample control="searchable-combo-wrapper" title="Combobox" -->
<pk-combobox label="Variant" placeholder="Type to search"><option value="AC-1001">AC-1001 - Widget 1</option><option value="AC-1002">AC-1002 - Widget 2</option></pk-combobox>

<!-- @sample control="tag-input-wrapper" title="Tags" -->
<pk-tag-input label="Tags" value="dc,variant"></pk-tag-input>
